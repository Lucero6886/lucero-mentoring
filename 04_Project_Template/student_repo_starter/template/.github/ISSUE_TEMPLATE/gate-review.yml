name: "🚦 Gate review"
description: "Mentor mở ở mỗi trạm kiểm soát tiến độ; kết luận ghi ngay trong issue này"
title: "Gate <N> — review"
labels: ["gate review"]
body:
  - type: markdown
    attributes:
      value: |
        Đối chiếu bằng chứng với **đúng câu chữ tiêu chí** trong `06_Data/milestone_gates.json` — không nới ngầm.
        Kết luận nằm lại đây vĩnh viễn, để không ai phải nhớ về sau.
  - type: dropdown
    id: gate
    attributes:
      label: Gate
      options:
        - "Gate 1 · Problem & Foundation (tuần 1–2)"
        - "Gate 2 · Baseline (tuần 3–5)"
        - "Gate 3 · Core Implementation (tuần 6–8)"
        - "Gate 4 · Experiments (tuần 9–11)"
        - "Gate 5 · Analysis & Draft (tuần 12–13)"
        - "Gate 6 · Reproducibility & Defense (tuần 14–15)"
    validations:
      required: true
  - type: textarea
    id: bang-chung
    attributes:
      label: Bằng chứng sinh viên nộp
      description: "Link tới commit, file, hình, log, release"
    validations:
      required: true
  - type: checkboxes
    id: kiem-tra
    attributes:
      label: Đối chiếu tiêu chí
      options:
        - label: "Bằng chứng khớp đúng tiêu chí qua của gate này (không nới lỏng)"
        - label: "Kết quả tái lập được: người khác chạy theo README ra kết quả tương tự"
        - label: "Sinh viên giải thích được mọi thành phần chính bằng lời của mình"
        - label: "MVT và Extension vẫn tách bạch đúng như charter"
  - type: dropdown
    id: ket-luan
    attributes:
      label: Kết luận
      options:
        - "PASS"
        - "CONDITIONAL_PASS — qua có điều kiện, ghi rõ điều kiện và hạn bên dưới"
        - "FAIL — áp luật cứng của gate"
        - "NOT_ENOUGH_EVIDENCE — chưa đủ bằng chứng để kết luận"
    validations:
      required: true
  - type: textarea
    id: quyet-dinh
    attributes:
      label: Quyết định và điều kiện kèm theo
      description: "Nếu CONDITIONAL_PASS: điều kiện gì, hạn nào. Nếu FAIL: phạm vi bị thu nhỏ ra sao."
      placeholder: |
        Ví dụ (Gate 2 FAIL): baseline chưa chạy → đóng research extension theo luật cứng.
        Phạm vi còn lại: hoàn thành MVT gồm ... · hạn rà lại: ...
    validations:
      required: true
  - type: textarea
    id: buoc-tiep
    attributes:
      label: Việc phải làm trước gate kế tiếp
      placeholder: "1–3 việc kèm hạn thực tế"
    validations:
      required: true
